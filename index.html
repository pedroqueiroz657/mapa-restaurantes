<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Onde a gente vai?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --mist:#EEF5F4; --ink:#0C2D3A; --muted:#4A666E; --sea:#1D6F7A;
  --sunset:#D9486B; --sunset-dark:#B93557; --sun:#F2A33A; --card:#FFFFFF; --line:#CBDDDA;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Figtree',system-ui,sans-serif;background:var(--mist);color:var(--ink);line-height:1.5;font-size:16px}
h1,h2{font-family:'Bricolage Grotesque','Figtree',sans-serif;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.15}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sunset);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:100vh;height:100dvh}
#map{height:100%;min-height:0;z-index:0;background:#dfe9e8}
.panel{overflow-y:auto;padding:26px 24px 40px;border-left:1px solid var(--line);background:var(--mist)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:40dvh minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line);padding:18px 16px 40px}
}

.head h1{font-size:clamp(1.55rem,3.2vw,2rem)}
.head p{margin:.5rem 0 0;color:var(--muted);max-width:42ch}

.aviso{margin:16px 0 0;padding:10px 12px;border-radius:10px;background:#FFF3D6;border:1px solid #EBC871;font-size:.9rem}

/* lista */
.lista{display:grid;gap:10px;margin-top:20px}
.item{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.item:hover{border-color:var(--sea)}
.item .txt{min-width:0;flex:1}
.item strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted)}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:#d6e6e4}
.ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--sea),#2F9AA6);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.thumb.ph{font-size:1.8rem}
.badge{flex:none;font-size:.78rem;font-weight:600;color:var(--sea);background:#DCEFEC;border-radius:999px;padding:3px 10px}

/* detalhe */
.voltar{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--sea);font-weight:600;padding:6px 0;cursor:pointer}
.voltar:hover{text-decoration:underline}
.capa{width:100%;aspect-ratio:16/10;border-radius:18px;object-fit:cover;display:block;margin:10px 0 16px;background:#d6e6e4}
.capa.ph{font-size:3.4rem}
.detalhe h2{font-size:1.6rem}
.bairro{color:var(--muted);margin:.25rem 0 0}
.site{display:inline-block;margin-top:12px;padding:8px 16px;border:1.5px solid var(--sea);border-radius:999px;color:var(--sea);font-weight:600;text-decoration:none}
.site:hover{background:var(--sea);color:#fff}

form{margin-top:22px;display:grid;gap:22px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.lbl{font-weight:600;padding:0;margin-bottom:8px;display:block}
.stars{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.star{border:0;background:none;padding:4px;cursor:pointer;line-height:0;border-radius:8px}
.star svg{width:36px;height:36px;fill:none;stroke:var(--sun);stroke-width:1.6;stroke-linejoin:round;transition:fill .12s}
.star.on svg{fill:var(--sun)}
.zero{margin-left:10px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.zero[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.notatxt{margin:6px 0 0;color:var(--muted);font-size:.9rem;min-height:1.4em}
input[type=datetime-local],textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
.enviar{border:0;border-radius:999px;background:var(--sunset);color:#fff;font-weight:600;padding:14px 22px;cursor:pointer;font-size:1rem}
.enviar:hover{background:var(--sunset-dark)}
.enviar[disabled]{opacity:.6;cursor:progress}
.msg{margin:0;font-size:.95rem;min-height:1.4em}
.msg.erro{color:#A3262F}
.msg.ok{color:#17703F;font-weight:600}

/* pins */
.pin{background:none;border:0}
.pin span{display:block;width:24px;height:24px;margin:3px;background:var(--sea);border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(12,45,58,.35);transition:transform .15s,background .15s}
.pin.sel span{background:var(--sunset);transform:rotate(-45deg) scale(1.25)}
.pin.feito span{background:var(--sun)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="map" role="application" aria-label="Mapa dos restaurantes"></div>

  <main class="panel" id="painel">
    <header class="head">
      <h1 id="titulo"></h1>
      <p>Toque num pin ou numa foto, dê a sua nota e marque quando quer ir.</p>
    </header>
    <p class="aviso" id="aviso" hidden></p>
    <div id="vista"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="restaurantes.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- utilidades ---------- */
  const $ = (s, el=document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const urlSegura = u => {
    if(!u) return "";
    try{ const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : ""; }
    catch{ return ""; }
  };
  const reduzMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CHAVE = "visitas-enviadas";
  const lerEnviadas = () => { try{ return JSON.parse(localStorage.getItem(CHAVE) || "{}"); }catch{ return {}; } };
  const gravarEnviada = (id, v) => { try{ const d = lerEnviadas(); d[id] = v; localStorage.setItem(CHAVE, JSON.stringify(d)); }catch{} };
  const agoraLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

  /* ---------- Supabase ---------- */
  const configurado = !String(CONFIG.SUPABASE_URL).includes("SEU-PROJETO") && !String(CONFIG.SUPABASE_ANON_KEY).includes("SUA-ANON");
  const sb = (configurado && window.supabase) ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
  if(!sb){
    const a = $("#aviso");
    a.hidden = false;
    a.textContent = "Supabase ainda não configurado: preencha config.js para as respostas serem salvas.";
  }

  $("#titulo").textContent = CONFIG.NOME ? `Onde a gente vai, ${CONFIG.NOME}?` : "Onde a gente vai?";
  document.title = "Onde a gente vai?";

  /* ---------- estado ---------- */
  const state = { sel: null, nota: null };
  const porId = Object.fromEntries(RESTAURANTES.map(r => [r.id, r]));
  const marcadores = {};

  /* ---------- mapa ---------- */
  const map = L.map("map", { zoomControl: true }).setView([-3.7275, -38.5], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  const icone = (cls="") => L.divIcon({ className: "pin " + cls, html: "<span></span>", iconSize: [30,30], iconAnchor: [15,32] });

  function atualizarPin(id){
    const m = marcadores[id]; if(!m) return;
    const feito = !!lerEnviadas()[id];
    m.setIcon(icone((state.sel === id ? "sel " : "") + (feito ? "feito" : "")));
  }

  RESTAURANTES.forEach(r => {
    const m = L.marker([r.lat, r.lng], { icon: icone(), title: r.nome, keyboard: true, alt: r.nome }).addTo(map);
    m.on("click", () => abrir(r.id));
    marcadores[r.id] = m;
    atualizarPin(r.id);
  });
  if(RESTAURANTES.length > 1){
    map.fitBounds(L.latLngBounds(RESTAURANTES.map(r => [r.lat, r.lng])), { padding: [50,50], maxZoom: 15 });
  }

  /* ---------- imagens ---------- */
  function imgOuPlaceholder(r, cls){
    const src = urlSegura(r.foto);
    const inicial = esc((r.nome || "?").trim().charAt(0).toUpperCase());
    if(!src) return `<div class="${cls} ph" aria-hidden="true">${inicial}</div>`;
    return `<img class="${cls}" src="${esc(src)}" alt="${cls === 'capa' ? 'Foto de ' + esc(r.nome) : ''}" loading="lazy" data-fb="${inicial}">`;
  }
  function ligarFallbackImg(raiz){
    raiz.querySelectorAll("img[data-fb]").forEach(img => {
      img.addEventListener("error", () => {
        const d = document.createElement("div");
        d.className = img.className + " ph";
        d.setAttribute("aria-hidden", "true");
        d.textContent = img.dataset.fb;
        img.replaceWith(d);
      }, { once: true });
    });
  }

  /* ---------- lista ---------- */
  function mostrarLista(){
    const enviadas = lerEnviadas();
    const vista = $("#vista");
    vista.innerHTML = `<div class="lista">${RESTAURANTES.map(r => `
      <button type="button" class="item" data-id="${esc(r.id)}">
        ${imgOuPlaceholder(r, "thumb")}
        <span class="txt"><strong>${esc(r.nome)}</strong><small>${esc(r.bairro)}</small></span>
        ${enviadas[r.id] ? '<span class="badge">Enviado</span>' : ""}
      </button>`).join("")}</div>`;
    vista.querySelectorAll(".item").forEach(b => b.addEventListener("click", () => abrir(b.dataset.id)));
    ligarFallbackImg(vista);
  }

  /* ---------- detalhe + formulário ---------- */
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>';

  function abrir(id){
    const r = porId[id]; if(!r) return;
    const anterior = state.sel;
    state.sel = id; state.nota = null;
    if(anterior) atualizarPin(anterior);
    atualizarPin(id);

    const link = urlSegura(r.link);
    $("#vista").innerHTML = `
      <section class="detalhe">
        <button type="button" class="voltar" id="voltar">← Todos os restaurantes</button>
        ${imgOuPlaceholder(r, "capa")}
        <h2>${esc(r.nome)}</h2>
        <p class="bairro">${esc(r.bairro)}</p>
        ${link ? `<a class="site" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Ver no site</a>` : ""}

        <form id="form" novalidate>
          <fieldset>
            <legend id="lgNota">Sua nota</legend>
            <div class="stars" role="radiogroup" aria-labelledby="lgNota">
              ${[1,2,3,4,5].map(v => `<button type="button" class="star" role="radio" aria-checked="false" aria-label="${v} ${v===1?'estrela':'estrelas'}" data-v="${v}">${STAR}</button>`).join("")}
              <button type="button" class="zero" role="radio" aria-checked="false" aria-label="Nota zero" data-v="0">Zero</button>
            </div>
            <p class="notatxt" id="notaTxt" aria-live="polite">Toque de novo na nota para limpar.</p>
          </fieldset>

          <div>
            <label class="lbl" for="quando">Quando vamos?</label>
            <input type="datetime-local" id="quando" min="${agoraLocal()}">
          </div>

          <div>
            <label class="lbl" for="comentario">Recado (opcional)</label>
            <textarea id="comentario" maxlength="500" placeholder="Ex.: prefiro mesa na varanda"></textarea>
          </div>

          <p class="msg" id="msg" role="status" aria-live="polite"></p>
          <button class="enviar" id="enviar" type="submit">Enviar resposta</button>
        </form>
      </section>`;

    const vista = $("#vista");
    ligarFallbackImg(vista);
    $("#voltar").addEventListener("click", () => {
      const antigo = state.sel; state.sel = null; atualizarPin(antigo); mostrarLista();
    });
    vista.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
      const v = Number(b.dataset.v);
      setNota(state.nota === v ? null : v);
    }));
    $("#form").addEventListener("submit", enviar);

    $("#painel").scrollTo({ top: 0 });
    map.flyTo([r.lat, r.lng], Math.max(map.getZoom(), 15), { animate: !reduzMovimento, duration: .6 });
  }

  function setNota(v){
    state.nota = v;
    document.querySelectorAll(".star").forEach(s => {
      const on = v !== null && v > 0 && Number(s.dataset.v) <= v;
      s.classList.toggle("on", on);
      s.setAttribute("aria-checked", String(v !== null && Number(s.dataset.v) === v));
    });
    const z = $(".zero"); z.setAttribute("aria-checked", String(v === 0));
    $("#notaTxt").textContent = v === null ? "Toque de novo na nota para limpar." : `Nota ${v} de 5`;
  }

  function mensagem(texto, tipo){
    const m = $("#msg"); m.textContent = texto; m.className = "msg " + (tipo || "");
  }

  async function enviar(e){
    e.preventDefault();
    const quandoVal = $("#quando").value;
    if(state.nota === null && !quandoVal){ mensagem("Escolha uma nota, uma data ou as duas coisas.", "erro"); return; }

    let quandoISO = null;
    if(quandoVal){
      const d = new Date(quandoVal);
      if(isNaN(d)){ mensagem("Data inválida. Escolha de novo.", "erro"); return; }
      quandoISO = d.toISOString();
    }
    if(!sb){ mensagem("Supabase não configurado. Preencha config.js.", "erro"); return; }

    const btn = $("#enviar");
    btn.disabled = true; btn.textContent = "Enviando…"; mensagem("");

    const { error } = await sb.from("visitas").insert({
      restaurante_id: state.sel,
      nota: state.nota,
      data_hora: quandoISO,
      comentario: $("#comentario").value.trim() || null,
    });

    btn.disabled = false; btn.textContent = "Enviar resposta";
    if(error){
      console.error(error);
      mensagem("Não foi possível enviar. Verifique a conexão e tente de novo.", "erro");
      return;
    }
    gravarEnviada(state.sel, { nota: state.nota, quando: quandoISO });
    atualizarPin(state.sel);
    mensagem("Enviado! Já chegou por aqui.", "ok");
  }

  mostrarLista();
  setTimeout(() => map.invalidateSize(), 150);
})();
</script>
</body>
</html>
